<!-- TAB 6: PLAYGROUND -->
<div class="glass-panel p-3 sm:p-4">
  <!-- ChatGPT-Style Main Chat Container with Sessions Sidebar -->
  <div class="bg-white rounded-2xl border border-slate-200/90 shadow-card flex flex-col md:flex-row h-[calc(100vh-215px)] min-h-[620px] overflow-hidden">

    <!-- Left Sidebar: Riwayat Sesi Chat (ChatGPT Style) -->
    <div class="w-full md:w-64 bg-slate-50 border-b md:border-b-0 md:border-r border-slate-200/80 flex flex-col shrink-0">
      <!-- Tombol Chat Baru -->
      <div class="p-3 border-b border-slate-200/80 bg-slate-100/70">
        <button class="btn btn-sm btn-primary w-full inline-flex items-center justify-center gap-2 text-xs font-bold shadow-xs py-2" onclick="createNewPlaygroundSession()">
          <svg class="w-3.5 h-3.5"><use href="#icon-plus"></use></svg> Chat Baru
        </button>
      </div>

      <!-- Daftar Riwayat Percakapan (Scrollable) -->
      <div class="flex-1 overflow-y-auto p-2 space-y-1" id="pgSessionsList">
        <!-- Rendered dynamically via renderPlaygroundSessionsList() -->
      </div>

      <!-- Footer Sidebar -->
      <div class="p-2.5 border-t border-slate-200/80 bg-slate-100/50 flex items-center justify-between text-[11px] text-slate-500">
        <span id="pgSessionCount" class="font-semibold text-slate-600">0 Percakapan</span>
        <button class="text-red-500 hover:text-red-700 font-semibold hover:underline" onclick="clearAllPlaygroundSessions()" title="Hapus semua riwayat percakapan">
          Hapus Semua
        </button>
      </div>
    </div>

    <!-- Right Column: Area Percakapan Aktif -->
    <div class="flex-1 flex flex-col h-full overflow-hidden bg-white">
      <!-- Header Percakapan Aktif -->
      <div class="px-4 py-2 border-b border-slate-100 flex flex-col gap-1.5 bg-white shrink-0">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2 min-w-0">
            <span class="w-2 h-2 rounded-full bg-emerald-500 shrink-0"></span>
            <span id="pgActiveSessionTitle" class="text-xs font-extrabold text-slate-800 truncate">Percakapan Baru</span>
          </div>
          <div class="flex items-center gap-2">
            <span id="pgStatus" class="badge badge-success text-[10px] py-0.5 px-2">Ready</span>
          </div>
        </div>

        <!-- Skills Selection Bar (Tepat di Bawah Title) -->
        <div class="flex items-center justify-between flex-wrap gap-1.5 pt-1 border-t border-slate-50">
          <div class="flex items-center gap-1.5 flex-wrap flex-1 min-w-0" id="pgSkillsPills">
            <!-- Populated dynamically via renderComboSkillsPills() -->
          </div>
          <button class="text-[10px] text-slate-400 hover:text-slate-700 font-semibold px-1.5 py-0.5 rounded transition-colors" onclick="clearAllComboSkills()" title="Kosongkan pilihan skills">Reset</button>
        </div>
      </div>

      <!-- Messages Area -->
      <div class="chat-messages p-4 md:p-5 overflow-y-auto flex-1 space-y-4" id="pgMessages"></div>

      <!-- Input Area (ChatGPT Style Capsule) -->
      <div class="chat-input-area p-3 bg-slate-50/70 border-t border-slate-200/80 w-full shrink-0">
        <div class="relative flex items-end w-full bg-white rounded-2xl border border-slate-300 shadow-xs focus-within:border-blue-500 focus-within:ring-2 focus-within:ring-blue-500/20 transition-all p-1.5">
          <textarea id="pgInput" rows="1" class="text-xs w-full flex-1 px-3 py-1.5 bg-transparent border-0 focus:outline-none focus:ring-0 resize-none max-h-36 leading-relaxed pr-10 text-slate-800 placeholder-slate-400" placeholder="Ketik ide/pertanyaan (Enter untuk kirim, Shift+Enter untuk baris baru)..." onkeydown="handlePlaygroundKeydown(event)" oninput="autoResizePlaygroundInput(this)"></textarea>
          <button id="pgSendBtn" class="w-8 h-8 rounded-xl bg-blue-600 hover:bg-blue-700 text-white flex items-center justify-center transition-all shrink-0 shadow-2xs mb-0.5 mr-0.5 disabled:opacity-40 disabled:cursor-not-allowed cursor-pointer" onclick="handlePlaygroundAction()" title="Kirim pesan">
            <svg class="w-4 h-4"><use href="#icon-chevron-up"></use></svg>
          </button>
        </div>
      </div>
    </div>

  </div>
</div>
