<!-- TAB 6: PLAYGROUND -->
<div class="glass-panel p-3 sm:p-4">
  <!-- ChatGPT-Style Main Chat Container with Sessions Sidebar -->
  <div class="bg-white rounded-2xl border border-slate-200/90 shadow-card flex flex-col md:flex-row h-[calc(100vh-215px)] min-h-[620px] overflow-hidden">

    <!-- Left Sidebar: Riwayat Sesi Chat (ChatGPT Style) -->
    <div class="w-full md:w-64 bg-slate-50 border-b md:border-b-0 md:border-r border-slate-200/80 flex flex-col shrink-0">
      <!-- Tombol Chat Baru -->
      <div class="p-3 border-b border-slate-200/80 bg-slate-100/70">
        <button class="btn btn-sm btn-primary w-full inline-flex items-center justify-center gap-2 text-xs font-bold shadow-xs py-2" onclick="createNewPlaygroundSession()">
          <svg class="w-3.5 h-3.5"><use href="#icon-plus"></use></svg> Chat Baru
        </button>
      </div>

      <!-- Daftar Riwayat Percakapan (Scrollable) -->
      <div class="flex-1 overflow-y-auto p-2 space-y-1" id="pgSessionsList">
        <!-- Rendered dynamically via renderPlaygroundSessionsList() -->
      </div>

      <!-- Footer Sidebar -->
      <div class="p-2.5 border-t border-slate-200/80 bg-slate-100/50 flex items-center justify-between text-[11px] text-slate-500">
        <span id="pgSessionCount" class="font-semibold text-slate-600">0 Percakapan</span>
        <button class="text-red-500 hover:text-red-700 font-semibold hover:underline" onclick="clearAllPlaygroundSessions()" title="Hapus semua riwayat percakapan">
          Hapus Semua
        </button>
      </div>
    </div>

    <!-- Right Column: Area Percakapan Aktif -->
    <div id="pgChatColumn" class="flex-1 flex flex-col h-full overflow-hidden bg-white min-w-0 transition-all duration-200">
      <!-- Header Percakapan Aktif -->
      <div class="px-4 py-2.5 border-b border-slate-100 flex flex-col gap-2 bg-white shrink-0 shadow-2xs">
        <!-- Row 1: Session Title, Status & Actions -->
        <div class="flex items-center justify-between flex-wrap gap-2">
          <div class="flex items-center gap-2 min-w-0">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 shrink-0"></span>
            <span id="pgActiveSessionTitle" class="text-xs sm:text-sm font-extrabold text-slate-800 truncate">Percakapan Baru</span>
          </div>
          <div class="flex items-center gap-2">
            <button id="pgToggleCanvasBtn" class="btn btn-sm btn-outline inline-flex items-center gap-1.5 text-xs font-semibold py-1 px-2.5 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 transition-all shadow-2xs cursor-pointer" onclick="togglePlaygroundCanvas()" title="Buka/Tutup Panel Canvas & Live Preview">
              <svg class="w-3.5 h-3.5 text-indigo-600"><use href="#icon-layers"></use></svg>
              <span id="pgToggleCanvasLabel">Canvas</span>
              <span id="pgCanvasBadge" class="hidden w-2 h-2 rounded-full bg-indigo-500 animate-pulse"></span>
            </button>
            <span id="pgStatus" class="badge badge-success text-[10px] py-0.5 px-2">Ready</span>
            <button class="p-1 rounded-lg text-slate-400 hover:text-red-600 hover:bg-red-50 transition-colors cursor-pointer" onclick="clearPlayground()" title="Bersihkan pesan di sesi ini">
              <svg class="w-3.5 h-3.5"><use href="#icon-trash-2"></use></svg>
            </button>
          </div>
        </div>

        <!-- Row 2: Model, Akun & Proyek Selectors (Selalu Tersedia Sepanjang Obrolan) -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 pt-1 border-t border-slate-100">
          <!-- Model Selector -->
          <div class="flex items-center gap-1.5 bg-slate-50 border border-slate-200/80 rounded-xl px-2.5 py-1 text-xs">
            <svg class="w-3.5 h-3.5 text-blue-600 shrink-0"><use href="#icon-cpu"></use></svg>
            <select id="pgModel" class="w-full bg-transparent text-xs font-bold text-slate-700 border-none focus:outline-none cursor-pointer truncate" onchange="handlePgModelChange(this.value)">
              <option value="gemini-3.8-flash-tiered">Gemini 3.8 Flash (Auto Tiered)</option>
              <option value="claude-sonnet-4-6">Claude Sonnet 4.6 (Thinking)</option>
              <option value="claude-opus-4-6-thinking">Claude Opus 4.6 (Thinking)</option>
              <option value="gpt-oss-120b-medium">GPT-OSS 120B (Medium)</option>
            </select>
          </div>

          <!-- Account Selector -->
          <div class="flex items-center gap-1.5 bg-slate-50 border border-slate-200/80 rounded-xl px-2.5 py-1 text-xs">
            <svg class="w-3.5 h-3.5 text-emerald-600 shrink-0"><use href="#icon-cloud"></use></svg>
            <select id="pgAccount" class="w-full bg-transparent text-xs font-semibold text-slate-700 border-none focus:outline-none cursor-pointer truncate" onchange="handlePgAccountChange(this.value)">
              <option value="">Auto (Account Pool)</option>
            </select>
          </div>

          <!-- Project Context Selector -->
          <div class="flex items-center gap-1.5 bg-slate-50 border border-slate-200/80 rounded-xl px-2.5 py-1 text-xs">
            <svg class="w-3.5 h-3.5 text-purple-600 shrink-0"><use href="#icon-layers"></use></svg>
            <select id="pgProject" class="w-full bg-transparent text-xs font-semibold text-slate-700 border-none focus:outline-none cursor-pointer truncate" onchange="handlePgProjectChange(this.value)">
              <option value="">Tanpa Proyek (General)</option>
            </select>
          </div>
        </div>

        <!-- Row 3: Skills Selection Bar -->
        <div class="flex items-center justify-between flex-wrap gap-1.5 pt-1 border-t border-slate-50">
          <div class="flex items-center gap-1.5 flex-wrap flex-1 min-w-0" id="pgSkillsPills">
            <!-- Populated dynamically via renderComboSkillsPills() -->
          </div>
          <div class="flex items-center gap-1 shrink-0">
            <button class="text-[10px] text-blue-600 hover:text-blue-800 font-semibold px-1.5 py-0.5 rounded transition-colors" onclick="selectAllComboSkills()" title="Pilih semua skills">Semua</button>
            <span class="text-slate-300">|</span>
            <button class="text-[10px] text-slate-400 hover:text-slate-700 font-semibold px-1.5 py-0.5 rounded transition-colors" onclick="clearAllComboSkills()" title="Kosongkan pilihan skills">Reset</button>
          </div>
        </div>
      </div>

      <!-- Messages Area -->
      <div class="chat-messages p-4 md:p-5 overflow-y-auto flex-1 space-y-4" id="pgMessages"></div>

      <!-- Input Area (ChatGPT Style Capsule) -->
      <div class="chat-input-area p-3 bg-slate-50/70 border-t border-slate-200/80 w-full shrink-0">
        <!-- Quick Prompt Chips Row (Always accessible during conversation) -->
        <div id="pgQuickPromptChips" class="flex items-center gap-1.5 overflow-x-auto pb-2 scrollbar-none text-[11px] empty:hidden"></div>

        <div class="relative flex items-end w-full bg-white rounded-2xl border border-slate-300 shadow-xs focus-within:border-blue-500 focus-within:ring-2 focus-within:ring-blue-500/20 transition-all p-1.5">
          <textarea id="pgInput" rows="1" class="text-xs w-full flex-1 px-3 py-1.5 bg-transparent border-0 focus:outline-none focus:ring-0 resize-none max-h-36 leading-relaxed pr-10 text-slate-800 placeholder-slate-400" placeholder="Ketik ide/pertanyaan (Enter untuk kirim, Shift+Enter untuk baris baru)..." onkeydown="handlePlaygroundKeydown(event)" oninput="autoResizePlaygroundInput(this)"></textarea>
          <button id="pgSendBtn" class="w-8 h-8 rounded-xl bg-blue-600 hover:bg-blue-700 text-white flex items-center justify-center transition-all shrink-0 shadow-2xs mb-0.5 mr-0.5 disabled:opacity-40 disabled:cursor-not-allowed cursor-pointer" onclick="handlePlaygroundAction()" title="Kirim pesan">
            <svg class="w-4 h-4"><use href="#icon-chevron-up"></use></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Rightmost Column: Canvas & Live Artifact Split Panel (Claude Style) -->
    <div id="pgCanvasPanel" class="hidden w-full md:w-[48%] lg:w-[50%] bg-slate-900 border-l border-slate-800 flex flex-col h-full overflow-hidden z-20 shrink-0 transition-all duration-200">
      <!-- Header Canvas -->
      <div class="px-3.5 py-2.5 bg-slate-950 border-b border-slate-800 flex items-center justify-between shrink-0 text-white gap-2">
        <div class="flex items-center gap-2 min-w-0">
          <div class="w-6 h-6 rounded-lg bg-indigo-600/30 border border-indigo-500/40 text-indigo-400 flex items-center justify-center shrink-0">
            <svg class="w-3.5 h-3.5"><use href="#icon-layers"></use></svg>
          </div>
          <div class="min-w-0">
            <div id="pgCanvasTitle" class="text-xs font-bold text-slate-100 truncate">Canvas Artifact</div>
            <div class="flex items-center gap-1.5 text-[10px] text-slate-400 font-mono">
              <span id="pgCanvasLang" class="uppercase text-indigo-400 font-semibold tracking-wider">HTML</span>
              <span>•</span>
              <span id="pgCanvasLines">0 baris</span>
            </div>
          </div>
        </div>

        <div class="flex items-center gap-1.5 shrink-0">
          <!-- View Mode Toggle: Preview vs Code -->
          <div class="flex items-center bg-slate-900 border border-slate-800 rounded-lg p-0.5 text-[11px] font-medium text-slate-400">
            <button id="pgCanvasModePreviewBtn" class="px-2.5 py-0.5 rounded-md text-white bg-slate-800 font-semibold shadow-2xs transition-all cursor-pointer" onclick="setCanvasViewMode('preview')">
              Preview
            </button>
            <button id="pgCanvasModeCodeBtn" class="px-2.5 py-0.5 rounded-md hover:text-white transition-all cursor-pointer" onclick="setCanvasViewMode('code')">
              Kode
            </button>
          </div>

          <!-- Action Buttons -->
          <button class="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition-colors cursor-pointer" onclick="refreshCanvasPreview()" title="Muat Ulang Preview">
            <svg class="w-3.5 h-3.5"><use href="#icon-refresh-cw"></use></svg>
          </button>
          <button class="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition-colors cursor-pointer" onclick="copyCanvasCode(this)" title="Salin Kode / Dokumen">
            <svg class="w-3.5 h-3.5"><use href="#icon-copy"></use></svg>
          </button>
          <button class="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition-colors cursor-pointer" onclick="downloadCanvasArtifact()" title="Unduh Berkas">
            <svg class="w-3.5 h-3.5"><use href="#icon-download"></use></svg>
          </button>
          <button class="p-1.5 rounded-lg text-slate-400 hover:text-red-400 hover:bg-slate-800 transition-colors cursor-pointer ml-0.5" onclick="closePlaygroundCanvas()" title="Tutup Canvas">
            <svg class="w-3.5 h-3.5"><use href="#icon-x"></use></svg>
          </button>
        </div>
      </div>

      <!-- Canvas Content Area -->
      <div class="flex-1 relative overflow-hidden bg-slate-950 flex flex-col min-h-0">
        <!-- Live Preview View (IFrame sandbox / Markdown preview) -->
        <div id="pgCanvasPreviewContainer" class="w-full h-full flex-1 flex flex-col bg-white overflow-auto relative">
          <iframe id="pgCanvasIframe" class="w-full h-full border-0 flex-1 bg-white" sandbox="allow-scripts allow-modals"></iframe>
          <div id="pgCanvasMarkdownContainer" class="hidden w-full h-full flex-1 p-6 overflow-y-auto bg-white text-slate-800 prose text-xs leading-relaxed max-w-none"></div>
        </div>

        <!-- Code Source View -->
        <div id="pgCanvasCodeContainer" class="hidden w-full h-full flex-1 overflow-auto bg-slate-950 p-4">
          <pre class="font-mono text-slate-100 text-[11.5px] leading-relaxed selection:bg-indigo-900 selection:text-white"><code id="pgCanvasCodeBlock"></code></pre>
        </div>
      </div>

      <!-- Canvas Status Bar -->
      <div class="px-3.5 py-1.5 bg-slate-950 border-t border-slate-800/80 flex items-center justify-between text-[10.5px] text-slate-400 font-mono shrink-0">
        <div class="flex items-center gap-2">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
          <span id="pgCanvasStatusText">Sandbox Siap</span>
        </div>
        <div class="flex items-center gap-3">
          <span id="pgCanvasCharCount">0 karakter</span>
          <button type="button" class="text-indigo-400 hover:text-indigo-300 font-sans font-medium text-[10.5px] hover:underline cursor-pointer" onclick="openCanvasInNewTab()">
            Buka Tab Baru ↗
          </button>
        </div>
      </div>
    </div>

  </div>
</div>
