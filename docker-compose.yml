services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: antigravity-gateway
    restart: unless-stopped
    ports:
      - "3456:3456"
    environment:
      - PORT=3456
      - DATA_DIR=/app/data
      - PROJECTS_DIR=/Projects
    volumes:
      - ./data:/app/data
      - ./public:/app/public
      - ..:/Projects:ro
    deploy:
      resources:
        limits:
          memory: 256M
